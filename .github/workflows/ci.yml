name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run openapi && git diff --exit-code -- docs/openapi.json
      - run: npm run db:generate && git diff --exit-code -- migrations && test -z "$(git ls-files --others --exclude-standard migrations)"
      - run: npm run build
